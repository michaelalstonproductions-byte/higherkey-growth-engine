<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HigherKey Review Queue</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --ink: #1d2430;
        --muted: #667085;
        --line: #d9dee8;
        --accent: #2563eb;
        --approved: #15803d;
        --rejected: #b42318;
        --pending: #92400e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .header-inner,
      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
      }

      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 0;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
      }

      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        font-size: 13px;
        padding: 6px 10px;
        white-space: nowrap;
      }

      main {
        padding: 22px 0 36px;
      }

      .notice {
        display: none;
        border: 1px solid #f3cf72;
        background: #fff7df;
        color: #6f4f00;
        padding: 12px 14px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 14px;
        line-height: 1.45;
      }

      .notice.visible {
        display: block;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .filter {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      label {
        color: var(--muted);
        font-size: 13px;
      }

      select,
      button {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        padding: 0 10px;
      }

      button {
        cursor: pointer;
      }

      button:hover,
      select:hover {
        border-color: #b8c0cf;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 16px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }

      .preview {
        background: #111827;
        display: grid;
        place-items: center;
        aspect-ratio: 9 / 16;
        max-height: 540px;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .body {
        padding: 14px;
      }

      .row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      .clip-id {
        font-weight: 700;
        font-size: 14px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .status {
        flex: 0 0 auto;
      }

      .status[data-state="pending"] {
        color: var(--pending);
      }

      .status[data-state="approved"] {
        color: var(--approved);
      }

      .status[data-state="rejected"] {
        color: var(--rejected);
      }

      .scoreline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 10px;
      }

      .score {
        color: var(--accent);
        font-size: 28px;
        font-weight: 800;
        line-height: 1;
      }

      .score-label {
        color: var(--muted);
        font-size: 12px;
      }

      .signals {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        margin: 10px 0;
      }

      .signal {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 7px 8px;
        min-width: 0;
      }

      .signal-value {
        display: block;
        color: var(--ink);
        font-size: 14px;
        font-weight: 750;
        line-height: 1.2;
      }

      .signal-label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.2;
        margin-top: 2px;
      }

      .hook {
        font-size: 18px;
        line-height: 1.25;
        font-weight: 750;
        margin: 0 0 8px;
      }

      .caption {
        color: #344054;
        font-size: 14px;
        line-height: 1.45;
        margin: 0 0 10px;
      }

      .package {
        border-top: 1px solid var(--line);
        margin-top: 12px;
        padding-top: 12px;
      }

      .package-title {
        font-size: 14px;
        font-weight: 750;
        line-height: 1.35;
        margin: 0 0 6px;
      }

      .package-cta {
        color: #344054;
        font-size: 13px;
        line-height: 1.4;
        margin: 0 0 10px;
      }

      .platforms {
        display: grid;
        gap: 8px;
      }

      .labels,
      .moments {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 10px 0;
      }

      .label,
      .moment {
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1;
        padding: 6px 8px;
      }

      .moment {
        color: var(--ink);
      }

      .platform {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 8px;
      }

      .platform-name {
        display: block;
        font-size: 12px;
        font-weight: 750;
        margin-bottom: 4px;
        text-transform: capitalize;
      }

      .platform-note {
        color: var(--muted);
        display: block;
        font-size: 12px;
        line-height: 1.35;
      }

      .hashtags,
      .meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .meta {
        display: grid;
        gap: 3px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
        margin-top: 10px;
      }

      .empty {
        display: none;
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 26px;
        text-align: center;
        color: var(--muted);
        background: #fff;
      }

      .empty.visible {
        display: block;
      }

      .analytics {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 16px;
        padding: 14px;
      }

      .analytics h2 {
        font-size: 16px;
        line-height: 1.2;
        margin: 0 0 10px;
      }

      .analytics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 10px;
      }

      .analytics-item {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 9px;
      }

      .analytics-value {
        display: block;
        font-size: 16px;
        font-weight: 800;
      }

      .analytics-label {
        color: var(--muted);
        display: block;
        font-size: 12px;
        margin-top: 3px;
      }

      @media (max-width: 720px) {
        .header-inner,
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .summary {
          justify-content: flex-start;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <h1>HigherKey Review Queue</h1>
        <div class="summary" id="summary">
          <span class="pill">Loading queue</span>
        </div>
      </div>
    </header>
    <main>
      <div class="notice" id="notice"></div>
      <div class="toolbar">
        <div class="filter">
          <label for="statusFilter">Status</label>
          <select id="statusFilter">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <div class="filter">
          <button id="exportApproved" type="button">Export Approved JSON</button>
          <button id="resetReviews" type="button">Reset Local Reviews</button>
        </div>
      </div>
      <section class="analytics" id="analyticsPanel">
        <h2>Analytics</h2>
        <div class="analytics-grid" id="analyticsGrid">
          <div class="analytics-item">
            <span class="analytics-value">No local metrics imported</span>
            <span class="analytics-label">Run scripts/import_performance_metrics.py</span>
          </div>
        </div>
      </section>
      <section class="grid" id="queueGrid" aria-live="polite"></section>
      <section class="empty" id="emptyState">No clips match the current filter.</section>
    </main>

    <script>
      const QUEUE_PATH = "../queue/review_queue.json";
      const LEARNING_SUMMARY_PATH = "../analytics/learning_summary.json";
      const TOP_PATTERNS_PATH = "../analytics/top_patterns.json";
      const REVIEW_KEY = "higherkey.review_status.v1";
      const grid = document.querySelector("#queueGrid");
      const summary = document.querySelector("#summary");
      const notice = document.querySelector("#notice");
      const statusFilter = document.querySelector("#statusFilter");
      const exportApproved = document.querySelector("#exportApproved");
      const resetReviews = document.querySelector("#resetReviews");
      const emptyState = document.querySelector("#emptyState");
      const analyticsGrid = document.querySelector("#analyticsGrid");
      let entries = [];
      let reviewState = loadReviewState();

      function loadReviewState() {
        try {
          return JSON.parse(localStorage.getItem(REVIEW_KEY) || "{}");
        } catch (error) {
          return {};
        }
      }

      function saveReviewState() {
        localStorage.setItem(REVIEW_KEY, JSON.stringify(reviewState));
      }

      async function readJson(path) {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`${path} returned ${response.status}`);
        }
        return response.json();
      }

      function normalizeStatus(entry) {
        const stored = reviewState[entry.id];
        if (stored === "approved" || stored === "rejected" || stored === "pending") {
          return stored;
        }
        return "pending";
      }

      function setNotice(message) {
        notice.textContent = message;
        notice.classList.toggle("visible", Boolean(message));
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);
      }

      function renderSummary(filtered) {
        const counts = entries.reduce((acc, entry) => {
          acc[normalizeStatus(entry)] += 1;
          return acc;
        }, { pending: 0, approved: 0, rejected: 0 });
        summary.innerHTML = [
          `<span class="pill">${entries.length} total</span>`,
          `<span class="pill">${filtered.length} shown</span>`,
          `<span class="pill">${counts.pending} pending</span>`,
          `<span class="pill">${counts.approved} approved</span>`,
          `<span class="pill">${counts.rejected} rejected</span>`
        ].join("");
      }

      function render() {
        const filter = statusFilter.value;
        const filtered = entries
          .filter((entry) => filter === "all" || normalizeStatus(entry) === filter)
          .sort((a, b) => scoreValue(b) - scoreValue(a));
        renderSummary(filtered);
        emptyState.classList.toggle("visible", filtered.length === 0);
        grid.innerHTML = filtered.map(renderCard).join("");

        grid.querySelectorAll("[data-status-select]").forEach((select) => {
          select.addEventListener("change", (event) => {
            const id = event.currentTarget.dataset.entryId;
            reviewState[id] = event.currentTarget.value;
            saveReviewState();
            render();
          });
        });
      }

      function scoreValue(entry) {
        return Number.isFinite(Number(entry.score)) ? Number(entry.score) : 0;
      }

      function formatMetric(value, fallback = "0") {
        if (value === null || value === undefined || value === "") {
          return fallback;
        }
        if (Number.isFinite(Number(value))) {
          return Number(value).toFixed(Number(value) % 1 === 0 ? 0 : 1);
        }
        return String(value);
      }

      function renderCard(entry) {
        const packageData = entry.package || {};
        const caption = entry.caption || {};
        const status = normalizeStatus(entry);
        const hook = packageData.hook || caption.hook || "Caption hook unavailable";
        const captionText = packageData.caption || caption.caption || "Caption draft unavailable.";
        const hashtags = Array.isArray(packageData.hashtags)
          ? packageData.hashtags.join(" ")
          : (Array.isArray(caption.hashtags) ? caption.hashtags.join(" ") : "");
        const visual = entry.analysis?.visual || {};
        const audio = entry.analysis?.audio || {};
        const reasons = Array.isArray(entry.score_details?.reasons) ? entry.score_details.reasons.join(", ") : "local score";
        const sceneLabels = packageData.scene_labels || entry.scene_labels || entry.analysis?.scene_labels || [];
        const hookMoments = packageData.hook_moments || entry.hook_moments || entry.analysis?.hook_moments || [];
        const packageHtml = renderPackage(packageData, entry);
        return `
          <article class="card">
            <div class="preview">
              <video src="../${escapeHtml(entry.clip_path)}" controls preload="metadata" playsinline></video>
            </div>
            <div class="body">
              <div class="row">
                <div class="clip-id">${escapeHtml(entry.clip_id)}</div>
                <select class="status" data-state="${status}" data-status-select data-entry-id="${escapeHtml(entry.id)}" aria-label="Review status for ${escapeHtml(entry.clip_id)}">
                  <option value="pending"${status === "pending" ? " selected" : ""}>Pending</option>
                  <option value="approved"${status === "approved" ? " selected" : ""}>Approved</option>
                  <option value="rejected"${status === "rejected" ? " selected" : ""}>Rejected</option>
                </select>
              </div>
              <div class="scoreline">
                <div>
                  <div class="score">${escapeHtml(scoreValue(entry))}</div>
                  <div class="score-label">Hook score</div>
                </div>
                <div class="score-label">${escapeHtml(reasons)}</div>
              </div>
              <p class="hook">${escapeHtml(hook)}</p>
              <p class="caption">${escapeHtml(captionText)}</p>
              <div class="hashtags">${escapeHtml(hashtags)}</div>
              ${renderSceneLabels(sceneLabels)}
              ${renderHookMoments(hookMoments)}
              <div class="signals" aria-label="Local analysis signals">
                <div class="signal">
                  <span class="signal-value">${escapeHtml(formatMetric(visual.scene_changes))}</span>
                  <span class="signal-label">Scene changes</span>
                </div>
                <div class="signal">
                  <span class="signal-value">${escapeHtml(formatMetric(visual.motion_intensity))}</span>
                  <span class="signal-label">Motion</span>
                </div>
                <div class="signal">
                  <span class="signal-value">${escapeHtml(formatMetric(visual.brightness_change))}</span>
                  <span class="signal-label">Brightness shift</span>
                </div>
                <div class="signal">
                  <span class="signal-value">${escapeHtml(formatMetric(audio.audio_energy_peaks))}</span>
                  <span class="signal-label">Audio peaks</span>
                </div>
              </div>
              ${packageHtml}
              <div class="meta">
                <div>Source: ${escapeHtml(entry.source_path)}</div>
                <div>Clip: ${escapeHtml(entry.clip_path)}</div>
                <div>Caption: ${escapeHtml(entry.caption_path || "none")}</div>
                <div>Package: ${escapeHtml(entry.package_path || "none")}</div>
                <div>Subtitles: ${escapeHtml(packageData.subtitle_status || entry.subtitle_status || "not_extracted")}</div>
              </div>
            </div>
          </article>
        `;
      }

      function renderSceneLabels(labels) {
        if (!Array.isArray(labels) || labels.length === 0) {
          return '<div class="labels"><span class="label">unlabeled</span></div>';
        }
        return `<div class="labels">${labels.map((label) => `<span class="label">${escapeHtml(label)}</span>`).join("")}</div>`;
      }

      function renderHookMoments(moments) {
        if (!Array.isArray(moments) || moments.length === 0) {
          return '<div class="moments"><span class="moment">0.0s opening context</span></div>';
        }
        return `<div class="moments">${moments.slice(0, 3).map((moment) => {
          const reasons = Array.isArray(moment.reasons) ? moment.reasons.join("+") : "hook";
          return `<span class="moment">${escapeHtml(formatMetric(moment.timestamp, "0"))}s ${escapeHtml(reasons)}</span>`;
        }).join("")}</div>`;
      }

      function renderPackage(packageData, entry) {
        const title = packageData.suggested_title || "Package details unavailable";
        const cta = packageData.suggested_cta || "CTA unavailable.";
        const subtitleStatus = packageData.subtitle_status || entry.subtitle_status || "not_extracted";
        const audioStatus = packageData.has_audio === true ? "audio detected" : "no audio detected";
        const platformNotes = packageData.platform_notes || {};
        const platformHtml = Object.entries(platformNotes).map(([platform, notes]) => {
          const noteText = Array.isArray(notes) ? notes.join(" ") : String(notes);
          return `
            <div class="platform">
              <span class="platform-name">${escapeHtml(platform.replaceAll("_", " "))}</span>
              <span class="platform-note">${escapeHtml(noteText)}</span>
            </div>
          `;
        }).join("");
        return `
          <section class="package">
            <p class="package-title">${escapeHtml(title)}</p>
            <p class="package-cta">${escapeHtml(cta)}</p>
            <div class="hashtags">${escapeHtml(`${subtitleStatus} / ${audioStatus}`)}</div>
            <div class="platforms">${platformHtml}</div>
          </section>
        `;
      }

      function exportApprovedReviews() {
        const approvedEntries = entries
          .filter((entry) => normalizeStatus(entry) === "approved")
          .map((entry) => ({
            id: entry.id,
            clip_id: entry.clip_id,
            package_path: entry.package_path || null,
            score: scoreValue(entry)
          }));
        const payload = {
          exported_at: new Date().toISOString(),
          source: "dashboard_localStorage",
          instructions: "Place this file at queue/approved_reviews.json, then run python3 scripts/export_approved_posts.py from the project root.",
          approved_entry_ids: approvedEntries.map((entry) => entry.id),
          approved_clip_ids: approvedEntries.map((entry) => entry.clip_id),
          approved: approvedEntries
        };
        const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "approved_reviews.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        setNotice(`${approvedEntries.length} approved review decision${approvedEntries.length === 1 ? "" : "s"} exported. Save the file as queue/approved_reviews.json before running the export script.`);
      }

      function renderAnalytics(summary, topPatterns) {
        if (!summary || !topPatterns) {
          return;
        }
        const insights = Array.isArray(topPatterns.insights) ? topPatterns.insights : [];
        const topItems = insights.map((insight) => {
          const top = insight.top;
          const value = top ? `${top.value} (${formatMetric(top.avg_actual_performance_score)})` : "No data";
          return `
            <div class="analytics-item">
              <span class="analytics-value">${escapeHtml(value)}</span>
              <span class="analytics-label">${escapeHtml(insight.type.replaceAll("_", " "))}</span>
            </div>
          `;
        }).join("");
        analyticsGrid.innerHTML = `
          <div class="analytics-item">
            <span class="analytics-value">${escapeHtml(summary.record_count || 0)}</span>
            <span class="analytics-label">performance records</span>
          </div>
          <div class="analytics-item">
            <span class="analytics-value">${escapeHtml(formatMetric(summary.avg_learning_delta || 0))}</span>
            <span class="analytics-label">avg learning delta</span>
          </div>
          ${topItems}
        `;
      }

      async function loadDashboard() {
        try {
          const queue = await readJson(QUEUE_PATH);
          const queueEntries = Array.isArray(queue.entries) ? queue.entries : [];
          entries = await Promise.all(queueEntries.map(async (entry) => {
            let caption = null;
            let packageData = null;
            if (entry.caption_path) {
              try {
                caption = await readJson(`../${entry.caption_path}`);
              } catch (error) {
                caption = { hook: "Caption failed to load", caption: error.message };
              }
            }
            if (entry.package_path) {
              try {
                packageData = await readJson(`../${entry.package_path}`);
              } catch (error) {
                packageData = { suggested_title: "Package failed to load", suggested_cta: error.message };
              }
            }
            return { ...entry, caption, package: packageData };
          }));
          entries.sort((a, b) => scoreValue(b) - scoreValue(a));
          try {
            renderAnalytics(await readJson(LEARNING_SUMMARY_PATH), await readJson(TOP_PATTERNS_PATH));
          } catch (error) {
            // Analytics files are optional until manual metrics are imported.
          }
          setNotice("");
          render();
        } catch (error) {
          summary.innerHTML = '<span class="pill">Queue unavailable</span>';
          setNotice(`Could not load ${QUEUE_PATH}. Open through a local server from the project root: python3 -m http.server 8000, then visit http://localhost:8000/dashboard/review.html`);
        }
      }

      statusFilter.addEventListener("change", render);
      exportApproved.addEventListener("click", exportApprovedReviews);
      resetReviews.addEventListener("click", () => {
        reviewState = {};
        saveReviewState();
        render();
      });

      loadDashboard();
    </script>
  </body>
</html>
