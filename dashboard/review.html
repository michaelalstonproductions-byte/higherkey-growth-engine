<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HigherKey Operator</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef1f5;
        --panel: #ffffff;
        --panel-2: #f8fafc;
        --ink: #172033;
        --muted: #667085;
        --line: #d8dee8;
        --accent: #1f6feb;
        --good: #15803d;
        --warn: #b7791f;
        --bad: #b42318;
        --shadow: 0 12px 28px rgba(16, 24, 40, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input, select {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        min-height: 36px;
        padding: 0 10px;
      }

      button { cursor: pointer; }
      button:hover, input:hover, select:hover { border-color: #aeb8c8; }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        background: #fff;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .header-inner {
        width: min(1440px, calc(100vw - 28px));
        margin: 0 auto;
        padding: 14px 0 12px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0;
        line-height: 1.1;
      }

      .subtitle {
        color: var(--muted);
        font-size: 13px;
        margin-top: 3px;
      }

      .status-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 10px;
        margin-top: 14px;
      }

      .status-card {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
      }

      .status-value {
        display: block;
        font-size: 20px;
        font-weight: 800;
        line-height: 1;
      }

      .status-label {
        color: var(--muted);
        display: block;
        font-size: 12px;
        margin-top: 5px;
      }

      main {
        width: min(1440px, calc(100vw - 28px));
        margin: 0 auto;
        padding: 18px 0 34px;
      }

      .tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        margin-bottom: 14px;
      }

      .tab {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--muted);
        flex: 0 0 auto;
        font-size: 14px;
      }

      .tab.active {
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 750;
      }

      .panel { display: none; }
      .panel.active { display: block; }

      .notice {
        display: none;
        border: 1px solid #f1cb66;
        background: #fff8df;
        color: #684b05;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 14px;
        font-size: 14px;
      }

      .notice.visible { display: block; }

      .toolbar, .filters {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }

      .filters {
        justify-content: flex-start;
        flex-wrap: wrap;
      }

      label {
        color: var(--muted);
        font-size: 12px;
      }

      input[type="search"] { min-width: 280px; }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 14px;
      }

      .wide-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 14px;
      }

      .card, .ops-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .ops-card { padding: 14px; }

      .preview {
        background: #0f172a;
        display: grid;
        place-items: center;
        aspect-ratio: 9 / 16;
        max-height: 500px;
      }

      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .body { padding: 13px; }

      .row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .clip-id {
        font-size: 13px;
        font-weight: 800;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .score {
        color: var(--accent);
        font-size: 28px;
        font-weight: 850;
        line-height: 1;
      }

      .score-label, .muted, .meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .title {
        font-size: 16px;
        font-weight: 800;
        line-height: 1.25;
        margin: 0 0 7px;
      }

      .caption {
        color: #344054;
        font-size: 13px;
        line-height: 1.45;
        margin: 0 0 8px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 8px 0;
      }

      .chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1;
        padding: 6px 8px;
      }

      .chip.strong {
        color: var(--ink);
        border-color: #b9c2d0;
      }

      .meta {
        border-top: 1px solid var(--line);
        display: grid;
        gap: 3px;
        margin-top: 10px;
        padding-top: 10px;
        overflow-wrap: anywhere;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
      }

      .metric-value {
        display: block;
        font-size: 18px;
        font-weight: 850;
      }

      .metric-label {
        color: var(--muted);
        display: block;
        font-size: 12px;
        margin-top: 3px;
      }

      .empty {
        display: none;
        background: #fff;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        padding: 24px;
        text-align: center;
      }

      .empty.visible { display: block; }

      @media (max-width: 900px) {
        .topbar, .toolbar { align-items: stretch; flex-direction: column; }
        .status-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        input[type="search"] { min-width: 180px; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="header-inner">
          <div class="topbar">
            <div>
              <h1>HigherKey Operator</h1>
              <div class="subtitle">Local growth engine control surface</div>
            </div>
            <div class="filters">
              <button id="exportApproved" type="button">Export Approved JSON</button>
              <button id="resetReviews" type="button">Reset Local Reviews</button>
            </div>
          </div>
          <section class="status-grid" id="systemStatus">
            <div class="status-card"><span class="status-value">...</span><span class="status-label">Queue</span></div>
          </section>
        </div>
      </header>

      <main>
        <div class="tabs" id="tabs">
          <button class="tab active" data-tab="queue">Queue</button>
          <button class="tab" data-tab="analytics">Analytics</button>
          <button class="tab" data-tab="search">Search</button>
          <button class="tab" data-tab="clusters">Clusters</button>
          <button class="tab" data-tab="exports">Exports</button>
          <button class="tab" data-tab="settings">Settings</button>
        </div>
        <div class="notice" id="notice"></div>

        <section class="panel active" id="panel-queue">
          <div class="toolbar">
            <div class="filters">
              <label for="queueStatusFilter">Status</label>
              <select id="queueStatusFilter">
                <option value="all">All</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>
            <div class="muted">Sorted by hook score</div>
          </div>
          <section class="grid" id="queueGrid"></section>
          <section class="empty" id="queueEmpty">No queue items match the current filter.</section>
        </section>

        <section class="panel" id="panel-analytics">
          <section class="wide-grid" id="analyticsGrid"></section>
          <section class="ops-card" style="margin-top:14px">
            <h2 class="title">Recent Performance</h2>
            <div id="recentPerformance" class="wide-grid"></div>
          </section>
        </section>

        <section class="panel" id="panel-search">
          <div class="filters">
            <label for="searchInput">Search</label>
            <input id="searchInput" type="search" placeholder="Hook, tag, label, title, cluster">
            <label for="tagFilter">Tag</label>
            <select id="tagFilter"><option value="all">All tags</option></select>
            <label for="labelFilter">Label</label>
            <select id="labelFilter"><option value="all">All labels</option></select>
            <label for="clusterFilter">Cluster</label>
            <select id="clusterFilter"><option value="all">All clusters</option></select>
            <label for="searchStatusFilter">Status</label>
            <select id="searchStatusFilter">
              <option value="all">All</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
            <label for="scoreFilter">Score</label>
            <select id="scoreFilter">
              <option value="all">Any</option>
              <option value="50">50+</option>
              <option value="25">25+</option>
            </select>
          </div>
          <section class="grid" id="searchGrid"></section>
          <section class="empty" id="searchEmpty">No indexed clips match the current search.</section>
        </section>

        <section class="panel" id="panel-clusters">
          <section class="wide-grid" id="clustersGrid"></section>
        </section>

        <section class="panel" id="panel-exports">
          <section class="wide-grid" id="exportsGrid"></section>
        </section>

        <section class="panel" id="panel-settings">
          <section class="wide-grid" id="settingsGrid"></section>
        </section>
      </main>
    </div>

    <script>
      const PATHS = {
        queue: "../queue/review_queue.json",
        learning: "../analytics/learning_summary.json",
        patterns: "../analytics/top_patterns.json",
        metadata: "../analytics/metadata_index.json",
        exports: "../out/approved_posts/manifest.json",
        index: "../analytics/video_index.json"
      };
      const REVIEW_KEY = "higherkey.review_status.v1";

      const state = {
        queue: { entries: [] },
        entries: [],
        metadata: { items: [], clusters: [] },
        metadataByClip: {},
        learning: null,
        patterns: null,
        exports: null,
        index: null,
        pipelineStatus: null,
        jobHistory: null,
        activityFeed: null,
        apiContract: null,
        review: loadReviewState(),
        activeTab: "queue"
      };

      const el = (id) => document.getElementById(id);

      function loadReviewState() {
        try { return JSON.parse(localStorage.getItem(REVIEW_KEY) || "{}"); }
        catch (error) { return {}; }
      }

      function saveReviewState() {
        localStorage.setItem(REVIEW_KEY, JSON.stringify(state.review));
      }

      async function readJson(path) {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) throw new Error(`${path} returned ${response.status}`);
        return response.json();
      }

      async function optionalJson(path, fallback) {
        try { return await readJson(path); }
        catch (error) { return fallback; }
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[char]);
      }

      function normalizeStatus(entry) {
        const stored = state.review[entry.id];
        return ["approved", "rejected", "pending"].includes(stored) ? stored : "pending";
      }

      function scoreValue(entry) {
        return Number.isFinite(Number(entry.score)) ? Number(entry.score) : 0;
      }

      function formatMetric(value, fallback = "0") {
        if (value === null || value === undefined || value === "") return fallback;
        const num = Number(value);
        return Number.isFinite(num) ? num.toFixed(num % 1 === 0 ? 0 : 1) : String(value);
      }

      function setNotice(message) {
        el("notice").textContent = message;
        el("notice").classList.toggle("visible", Boolean(message));
      }

      function chips(values, strong = false) {
        if (!Array.isArray(values) || values.length === 0) return "";
        return `<div class="chips">${values.slice(0, 10).map((value) => `<span class="chip${strong ? " strong" : ""}">${escapeHtml(value)}</span>`).join("")}</div>`;
      }

      function moments(values) {
        if (!Array.isArray(values) || values.length === 0) return chips(["0.0s opening_context"], true);
        return chips(values.slice(0, 3).map((moment) => `${formatMetric(moment.timestamp)}s ${(moment.reasons || ["hook"]).join("+")}`), true);
      }

      function card(entry, compact = false) {
        const metadata = entry.metadata || {};
        const packageData = entry.package || {};
        const title = metadata.optimized_title || packageData.suggested_title || packageData.hook || entry.clip_id;
        const tags = metadata.semantic_tags || [];
        const labels = metadata.scene_labels || packageData.scene_labels || entry.scene_labels || [];
        const hookMoments = packageData.hook_moments || entry.hook_moments || [];
        return `
          <article class="card">
            ${compact ? "" : `<div class="preview"><video src="../${escapeHtml(entry.clip_path)}" controls preload="metadata" playsinline></video></div>`}
            <div class="body">
              <div class="row">
                <div>
                  <div class="clip-id">${escapeHtml(entry.clip_id)}</div>
                  <div class="muted">${escapeHtml(metadata.cluster_id || "unclustered")}</div>
                </div>
                <div>
                  <div class="score">${escapeHtml(scoreValue(entry))}</div>
                  <div class="score-label">score</div>
                </div>
              </div>
              <p class="title">${escapeHtml(title)}</p>
              <p class="caption">${escapeHtml(packageData.caption || entry.caption?.caption || "")}</p>
              ${moments(hookMoments)}
              ${chips(labels, true)}
              ${chips(tags)}
              <div class="row">
                <select data-status-select data-entry-id="${escapeHtml(entry.id)}" aria-label="Approval status">
                  <option value="pending"${normalizeStatus(entry) === "pending" ? " selected" : ""}>Pending</option>
                  <option value="approved"${normalizeStatus(entry) === "approved" ? " selected" : ""}>Approved</option>
                  <option value="rejected"${normalizeStatus(entry) === "rejected" ? " selected" : ""}>Rejected</option>
                </select>
              </div>
              <div class="meta">
                <div>Clip: ${escapeHtml(entry.clip_path)}</div>
                <div>Package: ${escapeHtml(entry.package_path || "none")}</div>
              </div>
            </div>
          </article>
        `;
      }

      function wireStatusSelects(root) {
        root.querySelectorAll("[data-status-select]").forEach((select) => {
          select.addEventListener("change", (event) => {
            state.review[event.currentTarget.dataset.entryId] = event.currentTarget.value;
            saveReviewState();
            renderAll();
          });
        });
      }

      function renderStatus() {
        const approved = state.entries.filter((entry) => normalizeStatus(entry) === "approved").length;
        const exported = state.exports?.count || 0;
        const indexed = state.metadata?.count || state.metadata?.items?.length || 0;
        const lastRun = state.queue.updated_at || state.index?.videos ? state.queue.updated_at || "available" : "unknown";
        el("systemStatus").innerHTML = [
          ["Queue", state.entries.length],
          ["Approved", approved],
          ["Exported", exported],
          ["Indexed clips", indexed],
          ["Last pipeline run", lastRun || "unknown"]
        ].map(([label, value]) => `
          <div class="status-card"><span class="status-value">${escapeHtml(value)}</span><span class="status-label">${escapeHtml(label)}</span></div>
        `).join("");
      }

      function renderQueue() {
        const filter = el("queueStatusFilter").value;
        const entries = state.entries
          .filter((entry) => filter === "all" || normalizeStatus(entry) === filter)
          .sort((a, b) => scoreValue(b) - scoreValue(a));
        el("queueGrid").innerHTML = entries.map((entry) => card(entry)).join("");
        el("queueEmpty").classList.toggle("visible", entries.length === 0);
        wireStatusSelects(el("queueGrid"));
      }

      function renderAnalytics() {
        const summary = state.learning || {};
        const insights = state.patterns?.insights || [];
        el("analyticsGrid").innerHTML = [
          metric("Performance records", summary.record_count || 0),
          metric("Avg predicted score", summary.avg_predicted_hook_score || 0),
          metric("Avg actual score", summary.avg_actual_performance_score || 0),
          metric("Avg learning delta", summary.avg_learning_delta || 0),
          ...insights.map((insight) => metric(insight.type.replaceAll("_", " "), insight.top ? `${insight.top.value} (${formatMetric(insight.top.avg_actual_performance_score)})` : "No data"))
        ].join("");
        el("recentPerformance").innerHTML = (summary.recent_records || []).slice().reverse().map((record) => `
          <div class="ops-card">
            <p class="title">${escapeHtml(record.clip_id || record.queue_entry_id)}</p>
            <div class="muted">Predicted ${escapeHtml(record.predicted_hook_score)} / Actual ${escapeHtml(record.actual_performance_score)} / Delta ${escapeHtml(record.learning_delta)}</div>
          </div>
        `).join("") || `<div class="ops-card muted">No performance history imported.</div>`;
      }

      function metric(label, value) {
        return `<div class="metric"><span class="metric-value">${escapeHtml(value)}</span><span class="metric-label">${escapeHtml(label)}</span></div>`;
      }

      function passesSearch(entry) {
        const metadata = entry.metadata || {};
        const query = el("searchInput").value.trim().toLowerCase();
        const tags = metadata.semantic_tags || [];
        const labels = metadata.scene_labels || entry.scene_labels || [];
        const cluster = metadata.cluster_id || "";
        const text = [metadata.search_text, metadata.optimized_title, entry.clip_id, entry.package?.hook, entry.package?.caption, tags.join(" "), labels.join(" "), cluster].join(" ").toLowerCase();
        if (query && !text.includes(query)) return false;
        if (el("tagFilter").value !== "all" && !tags.includes(el("tagFilter").value)) return false;
        if (el("labelFilter").value !== "all" && !labels.includes(el("labelFilter").value)) return false;
        if (el("clusterFilter").value !== "all" && cluster !== el("clusterFilter").value) return false;
        if (el("searchStatusFilter").value !== "all" && normalizeStatus(entry) !== el("searchStatusFilter").value) return false;
        if (el("scoreFilter").value !== "all" && scoreValue(entry) < Number(el("scoreFilter").value)) return false;
        return true;
      }

      function renderSearch() {
        const entries = state.entries.filter(passesSearch).sort((a, b) => scoreValue(b) - scoreValue(a));
        el("searchGrid").innerHTML = entries.map((entry) => card(entry, true)).join("");
        el("searchEmpty").classList.toggle("visible", entries.length === 0);
        wireStatusSelects(el("searchGrid"));
      }

      function renderClusters() {
        const clusters = state.metadata.clusters || [];
        el("clustersGrid").innerHTML = clusters.map((cluster) => `
          <div class="ops-card">
            <p class="title">${escapeHtml(cluster.id)} · ${escapeHtml(cluster.topic_summary)}</p>
            ${chips(cluster.representative_tags, true)}
            <div class="muted">${escapeHtml((cluster.clip_ids || []).length)} clips</div>
            <div class="meta">${(cluster.clip_ids || []).slice(0, 12).map((id) => `<div>${escapeHtml(id)}</div>`).join("")}</div>
          </div>
        `).join("") || `<div class="ops-card muted">No metadata clusters. Run scripts/rebuild_metadata_index.py.</div>`;
      }

      function renderExports() {
        const posts = state.exports?.posts || [];
        el("exportsGrid").innerHTML = posts.map((post) => `
          <div class="ops-card">
            <p class="title">${escapeHtml(post.clip_id)}</p>
            <div class="muted">Score ${escapeHtml(post.score)} · ${escapeHtml(post.status)}</div>
            <div class="meta">
              <div>Video: ${escapeHtml(post.final_video)}</div>
              <div>Caption: ${escapeHtml(post.caption_txt)}</div>
              <div>Manifest: ${escapeHtml(post.id)}</div>
            </div>
          </div>
        `).join("") || `<div class="ops-card muted">No approved export manifest found. Approve clips, export approved JSON, then run scripts/export_approved_posts.py.</div>`;
      }

      function renderSettings() {
        const ai = state.metadata.optional_ai_status || {};
        const status = state.pipelineStatus || {};
        const jobs = state.jobHistory?.jobs || [];
        const events = state.activityFeed?.events || [];
        const api = state.apiContract || {};
        const hasBridge = Boolean(window.higherkey);
        el("settingsGrid").innerHTML = `
          <div class="ops-card">
            <p class="title">Settings / Config</p>
            <div class="muted">${hasBridge ? "Desktop bridge available" : "Static browser mode"}</div>
            <div class="filters">
              <button data-desktop-action="pick-content">Pick Content Inbox</button>
              <button data-desktop-action="pick-export">Pick Export Directory</button>
              <button data-desktop-action="pick-analytics">Pick Analytics Directory</button>
            </div>
            <div class="meta"><div>Config path: config/</div><div>Queue path: queue/review_queue.json</div><div>Drag/drop ingest is enabled in Electron.</div></div>
          </div>
          <div class="ops-card">
            <p class="title">Local AI Status</p>
            <div class="meta">
              <div>Whisper: ${escapeHtml(ai.whisper?.available ? "available" : "optional / unavailable")}</div>
              <div>OCR: ${escapeHtml(ai.ocr?.available ? "available" : "optional / unavailable")}</div>
              <div>Default mode: deterministic local fallback</div>
            </div>
          </div>
          <div class="ops-card">
            <p class="title">Jobs / History</p>
            <div class="muted">${escapeHtml(status.state || "unknown")} · ${escapeHtml(status.message || "No daemon status yet")}</div>
            <div class="filters">
              <button data-desktop-action="start-watcher">Start Watcher</button>
              <button data-desktop-action="stop-watcher">Stop Watcher</button>
              <button data-desktop-action="run-once">Run Once</button>
              <button data-desktop-action="notify-test">Test Notification</button>
            </div>
            <div class="meta">
              <div>Queued: ${escapeHtml(status.counts?.queued || 0)}</div>
              <div>Processing: ${escapeHtml(status.counts?.processing || 0)}</div>
              <div>Completed: ${escapeHtml(status.counts?.completed || 0)}</div>
              <div>Failed: ${escapeHtml(status.counts?.failed || 0)}</div>
            </div>
            <div class="meta">${jobs.slice(-6).reverse().map((job) => `<div>${escapeHtml(job.state)} · ${escapeHtml(job.source_path)}</div>`).join("") || "<div>No job history yet.</div>"}</div>
          </div>
          <div class="ops-card">
            <p class="title">Logs / Status</p>
            <div class="muted">Activity feed and local API placeholder.</div>
            <div class="meta">
              <div>Status path: analytics/pipeline_status.json</div>
              <div>Activity path: analytics/activity_feed.json</div>
              <div>API contract: ${escapeHtml(api.description || "not generated yet")}</div>
            </div>
            <div class="meta">${events.slice(-8).reverse().map((event) => `<div>${escapeHtml(event.at)} · ${escapeHtml(event.event)} · ${escapeHtml(event.message)}</div>`).join("") || "<div>No activity events yet.</div>"}</div>
          </div>
        `;
        wireDesktopActions();
      }

      function wireDesktopActions() {
        document.querySelectorAll("[data-desktop-action]").forEach((button) => {
          button.disabled = !window.higherkey;
          button.addEventListener("click", async () => {
            if (!window.higherkey) {
              setNotice("Desktop actions require the Electron shell. Static browser mode remains read-only.");
              return;
            }
            const action = button.dataset.desktopAction;
            if (action === "pick-content") await window.higherkey.pickDirectory("contentInbox");
            if (action === "pick-export") await window.higherkey.pickDirectory("exportDirectory");
            if (action === "pick-analytics") await window.higherkey.pickDirectory("analyticsDirectory");
            if (action === "start-watcher") await window.higherkey.startWatcher();
            if (action === "stop-watcher") await window.higherkey.stopWatcher();
            if (action === "run-once") await window.higherkey.runPipelineOnce();
            if (action === "notify-test") await window.higherkey.testNotification();
            setNotice(`Desktop action completed: ${action}`);
          });
        });
      }

      function populateFilters() {
        const tags = new Set();
        const labels = new Set();
        const clusters = new Set();
        state.entries.forEach((entry) => {
          (entry.metadata?.semantic_tags || []).forEach((tag) => tags.add(tag));
          (entry.metadata?.scene_labels || entry.scene_labels || []).forEach((label) => labels.add(label));
          if (entry.metadata?.cluster_id) clusters.add(entry.metadata.cluster_id);
        });
        fillSelect(el("tagFilter"), "All tags", tags);
        fillSelect(el("labelFilter"), "All labels", labels);
        fillSelect(el("clusterFilter"), "All clusters", clusters);
      }

      function fillSelect(select, label, values) {
        const current = select.value;
        select.innerHTML = `<option value="all">${label}</option>` + [...values].sort().map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
        select.value = [...values].includes(current) ? current : "all";
      }

      function exportApprovedReviews() {
        const approved = state.entries.filter((entry) => normalizeStatus(entry) === "approved").map((entry) => ({
          id: entry.id, clip_id: entry.clip_id, package_path: entry.package_path || null, score: scoreValue(entry)
        }));
        const payload = {
          exported_at: new Date().toISOString(),
          source: "operator_localStorage",
          instructions: "Place this file at queue/approved_reviews.json, then run python3 scripts/export_approved_posts.py from the project root.",
          approved_entry_ids: approved.map((entry) => entry.id),
          approved_clip_ids: approved.map((entry) => entry.clip_id),
          approved
        };
        const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "approved_reviews.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        setNotice(`${approved.length} approved review decision${approved.length === 1 ? "" : "s"} exported. Save as queue/approved_reviews.json before running the export script.`);
      }

      function renderAll() {
        renderStatus();
        renderQueue();
        renderAnalytics();
        renderSearch();
        renderClusters();
        renderExports();
        renderSettings();
      }

      async function loadDashboard() {
        try {
          state.queue = await readJson(PATHS.queue);
          state.learning = await optionalJson(PATHS.learning, null);
          state.patterns = await optionalJson(PATHS.patterns, null);
          state.metadata = await optionalJson(PATHS.metadata, { items: [], clusters: [] });
          state.exports = await optionalJson(PATHS.exports, null);
          state.index = await optionalJson(PATHS.index, null);
          state.pipelineStatus = await optionalJson("../analytics/pipeline_status.json", null);
          state.jobHistory = await optionalJson("../analytics/job_history.json", null);
          state.activityFeed = await optionalJson("../analytics/activity_feed.json", null);
          state.apiContract = await optionalJson("../analytics/local_api_contract.json", null);
          state.metadataByClip = Object.fromEntries((state.metadata.items || []).map((item) => [item.clip_id, item]));

          const queueEntries = Array.isArray(state.queue.entries) ? state.queue.entries : [];
          state.entries = await Promise.all(queueEntries.map(async (entry) => {
            let packageData = null;
            let caption = null;
            if (entry.package_path) packageData = await optionalJson(`../${entry.package_path}`, null);
            if (entry.caption_path) caption = await optionalJson(`../${entry.caption_path}`, null);
            return { ...entry, package: packageData, caption, metadata: state.metadataByClip[entry.clip_id] || null };
          }));
          populateFilters();
          renderAll();
        } catch (error) {
          setNotice(`Could not load local dashboard data. Start from the project root with python3 -m http.server 8000, then open /dashboard/review.html.`);
        }
      }

      window.addEventListener("dragover", (event) => {
        if (window.higherkey) event.preventDefault();
      });
      window.addEventListener("drop", async (event) => {
        if (!window.higherkey) return;
        event.preventDefault();
        const paths = [...event.dataTransfer.files].map((file) => file.path).filter(Boolean);
        if (paths.length) {
          const result = await window.higherkey.ingestDroppedFiles(paths);
          setNotice(`Ingested ${result.copied.length} file${result.copied.length === 1 ? "" : "s"} into ${result.inbox}`);
        }
      });

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          state.activeTab = tab.dataset.tab;
          document.querySelectorAll(".tab").forEach((node) => node.classList.toggle("active", node === tab));
          document.querySelectorAll(".panel").forEach((panel) => panel.classList.toggle("active", panel.id === `panel-${state.activeTab}`));
        });
      });

      ["queueStatusFilter", "searchInput", "tagFilter", "labelFilter", "clusterFilter", "searchStatusFilter", "scoreFilter"].forEach((id) => {
        el(id).addEventListener(id === "searchInput" ? "input" : "change", renderAll);
      });
      el("exportApproved").addEventListener("click", exportApprovedReviews);
      el("resetReviews").addEventListener("click", () => {
        state.review = {};
        saveReviewState();
        renderAll();
      });

      loadDashboard();
    </script>
  </body>
</html>
