<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HigherKey Operator OS</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #080b10;
        color: #eef4ff;
        display: grid;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        height: 100vh;
        margin: 0;
        place-items: center;
      }
      main { text-align: center; width: min(420px, calc(100vw - 48px)); }
      .mark {
        align-items: center;
        background: #121c29;
        border: 1px solid #2b3d54;
        border-radius: 18px;
        color: #65a8ff;
        display: inline-flex;
        font-size: 28px;
        font-weight: 850;
        height: 84px;
        justify-content: center;
        margin-bottom: 18px;
        width: 84px;
      }
      h1 { font-size: 24px; letter-spacing: 0; margin: 0 0 8px; }
      p { color: #8fa1b8; line-height: 1.45; margin: 0; }
      .badge { border: 1px solid #2f7ed7; border-radius: 999px; color: #65a8ff; display: inline-block; font-size: 12px; margin-top: 16px; padding: 6px 10px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">HK</div>
      <h1>HigherKey Operator OS</h1>
      <p>Starting local release-candidate workspace.</p>
      <div class="badge">V2.7 RC · Local-first</div>
    </main>
  </body>
</html>
